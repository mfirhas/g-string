[package]
name = "g-string"
version = "0.0.0"
edition = "2024"
description = "Generic String"
license = "MIT"
exclude = [
  "**/*_test.rs",
  "tests/**",
  "examples/**",
  "Makefile",
  "AGENTS.md",
]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "test"
path = "tests/test.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde"]
grapheme = ["unicode-segmentation"]

[dependencies]
unicode-segmentation = { version = "1", optional = true }
serde = { version = "1", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
