[package]
name = "g-string"
version = "0.1.2"
edition = "2024"
authors = ["Muhammad Fathir Irhas <fathir.irhas@gmail.com>"]
description = "Stack-allocated string type with generic configurations."
license = "MIT"
repository = "https://github.com/mfirhas/g-string"
documentation = "https://docs.rs/g-string"
keywords = ["string", "generic", "secret", "type-safe", "no-std"]
categories = ["text-processing", "data-structures"]
exclude = [
  "**/*_test.rs",
  "tests/**",
  "benches/**",
  "examples/**",
  ".github/**",
  ".gitignore",
  "Makefile",
  "AGENTS.md",
]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "test"
path = "tests/test.rs"

[[bench]]
name = "bench"
harness = false

[features]
default = ["std"]
std = ["alloc", "serde?/std"]
alloc = ["serde?/alloc"]
serde = ["dep:serde"]
secret = ["dep:zeroize"]
grapheme = ["dep:unicode-segmentation"]

[dependencies]
serde = { version = "1", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, optional = true }
unicode-segmentation = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

