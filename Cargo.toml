[package]
name = "g-string"
version = "0.0.0"
edition = "2024"
description = "Generic String"
license = "MIT"
exclude = [
  "**/*_test.rs",
  "tests/**",
  "benches/**",
  "examples/**",
  "Makefile",
  "AGENTS.md",
]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "test"
path = "tests/test.rs"

[[bench]]
name = "bench"
harness = false

[features]
default = ["std"]
std = ["alloc", "serde?/std"]
alloc = ["serde?/alloc"]
serde = ["dep:serde"]
secret = ["dep:zeroize"]
grapheme = ["unicode-segmentation"]

[dependencies]
serde = { version = "1", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, optional = true }
unicode-segmentation = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

