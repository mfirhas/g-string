[package]
name = "g-string"
version = "0.0.0"
edition = "2024"
description = "Generic String"
license = "MIT"

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "test"
path = "tests/test.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
grapheme = ["unicode-segmentation"]

[dependencies]
unicode-segmentation = { version = "1", optional = true }
